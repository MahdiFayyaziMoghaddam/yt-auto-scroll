<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="style.css" />
		<title>YT Auto Scroll</title>
	</head>
	<body>
		<h1>
			Auto Scroll
			<span>for YouTube short</span>
		</h1>

			<div class="switch-thumb"></div>
		</label>
		<p>Status: <span class="auto-scroll-status"></span></p>
		<script src="script.js"></script>
	</body>
</html>
